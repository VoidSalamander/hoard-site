# 推上 main 就建置網站並發布到 GitHub Pages（自訂網域在 public/CNAME）。
# public/ 原樣複製進 dist/：public/plugins/ 是 hoard repo 的 `bun run pack:plugins --out ../hoard-site/public/plugins`
# 產生的插件 zip、.sig 與 index.json（App 的「取得插件」讀它），public/update/latest.json 是 App 自動更新讀的。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
